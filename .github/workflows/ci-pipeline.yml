name: Node.js Docker CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t devops-nodejs-api:${{ github.sha }} .

      - name: Run container test
        run: |
          docker run -d -p 3000:3000 --name test-container devops-nodejs-api:${{ github.sha }}
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3000/health > health.json; then
              break
            fi
            sleep 1
          done
          node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("health.json","utf8")); if(h.status!=="UP" || h.service!=="Node.js Container API") process.exit(1); console.log(h);'
          curl --fail --silent http://localhost:3000/

      - name: Show container logs and clean up
        if: always()
        run: |
          docker logs test-container || true
          docker rm -f test-container || true
